[workspace]
members  = ["contracts/*"]
resolver = "3"

[profile.release]
opt-level       = 3    # Use slightly better optimizations.
overflow-checks = true # Disable integer overflow checks.


[workspace.dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
bech32 = "0.9.1"
cosmos-sdk-proto = { git = "https://github.com/permissionlessweb/cosmos-rust", branch = "main", features = ["xion"] }
cosmwasm-schema = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "mvp" }
cosmwasm-std = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "mvp" }
# cw-address-like = "2.0.0"
cw-address-like = { git = "https://github.com/permissionlessweb/cw-plus-plus", branch = "feat/mvp" }
cw-storage-plus = { git = "https://github.com/permissionlessweb/cw-storage-plus", branch = "mvp" }
cw-utils = { git = "https://github.com/permissionlessweb/cw-minus", branch = "main" }
cw2 = { git = "https://github.com/permissionlessweb/cw-minus", branch = "main" }
cw721 = { git = "https://github.com/permissionlessweb/cw-nfts", branch = "cw3" }
#cw721 = "0.21.0"
cw721-base = { git = "https://github.com/permissionlessweb/cw-nfts", branch = "cw3" }
#cw721-base = "0.21.0"
ed25519-zebra = { version = "=4.0.3", default-features = false }
getrandom = { version = "0.2.10", features = ["custom"] }
hex = "0.4"
p256 = { version = "0.13.2", features = ["ecdsa-core", "arithmetic", "serde"] }
phf = { version = "0.11.2", features = ["macros"] }
ripemd = "0.1.3"
rsa = { version = "0.9.2" }
schemars = "0.8"
serde = { version = "1.0.203", default-features = false, features = ["derive"] }
serde_json = "1.0.87"
sha2 = { version = "0.10.8", features = ["oid"] }
thiserror = "1"
tiny-keccak = { version = "2", features = ["keccak"] }
url = "2.5.2"
