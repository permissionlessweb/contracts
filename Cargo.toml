[workspace]
members  = ["contracts/*"]
resolver = "3"

[profile.release]
opt-level       = 3    # Use slightly better optimizations.
overflow-checks = true # Disable integer overflow checks.


[workspace.dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
bech32 = "0.9.1"
cosmos-sdk-proto = { path = "../cosmos-rust/cosmos-sdk-proto", default-features = false, features = [ "std", "cosmwasm", "xion", "serde", ] }
cosmwasm-schema = "3.0.4"
cosmwasm-std = { version = "3.0.4", features = ["stargate", "cosmwasm_2_1"] }
# cw-address-like = "2.0.0"
cw-address-like = { path = "../cw-plus-plus/packages/address-like" }
cw-storage-plus = "3.0.1"
cw-utils = { path = "../cw-minus/packages/cw-utils" }
cw2 = { path = "../cw-minus/packages/cw2" }
cw721 = {path = "../cw-nfts/packages/cw721"}
#cw721 = "0.21.0"
cw721-base = {path = "../cw-nfts/contracts/cw721-base"}
#cw721-base = "0.21.0"
ed25519-zebra = { version = "=4.0.3", default-features = false }
getrandom = { version = "0.2.10", features = ["custom"] }
hex = "0.4"
p256 = { version = "0.13.2", features = ["ecdsa-core", "arithmetic", "serde"] }
phf = { version = "0.11.2", features = ["macros"] }
ripemd = "0.1.3"
rsa = { version = "0.9.2" }
schemars = "0.8"
serde = { version = "1.0.203", default-features = false, features = ["derive"] }
serde_json = "1.0.87"
sha2 = { version = "0.10.8", features = ["oid"] }
thiserror = "1"
tiny-keccak = { version = "2", features = ["keccak"] }
url = "2.5.2"
